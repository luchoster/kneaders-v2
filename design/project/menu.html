<!doctype html>
<html lang="en" data-theme="light" data-accent="bakery-red" data-type="grotesk-serif" data-density="editorial">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Menu — Kneaders Bakery & Café</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="shared/fonts.css" />
<link rel="stylesheet" href="shared/tokens.css?v=6" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/framer-motion@10.18.0/dist/framer-motion.js" crossorigin="anonymous"></script>
<script>
  window.framerMotion = window.framerMotion || window.FramerMotion || window.Motion;
  if (window.framerMotion) window.dispatchEvent(new Event("fm-ready"));
</script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="shared/data.js?v=4"></script>
<script type="text/babel" src="shared/shell.jsx?v=2"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="shared/tweaks-app.jsx"></script>
<script type="text/babel" src="menu/sections.jsx"></script>
<script type="text/babel">
  function App() {
    return (
      <>
        <window.HL_TopBar />
        <window.HL_Nav active="menu" />
        <main>
          <window.HL_MenuHero />
          <window.HL_UtilityRail />
          <window.HL_FeaturedRail />
          <window.HL_MenuBody />
          <window.HL_SoupSchedule />
        </main>
        <window.HL_Footer />
        <window.HL_HearthlineTweaks />
      </>
    );
  }
  function boot() {
    if (!window.framerMotion) return window.addEventListener("fm-ready", boot, { once: true });
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  }
  boot();
</script>
</body>
</html>
